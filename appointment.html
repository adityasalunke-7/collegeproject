<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book an appointment | Vimal Clinic</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✚</span><span>vimal<span class="brand-light">clinic</span><small>CARE, CLOSE TO HOME</small></span></a><a class="text-link" href="index.html">← Back home</a></header><main class="form-wrap"><section class="form-card"><div class="eyebrow">LET’S FIND A TIME</div><h1>Book your visit.</h1><p>Send us your preferred date and time. Our team will confirm your appointment.</p><form data-api="/api/appointments"><label for="name">Your name</label><input id="name" name="name" type="text" placeholder="Full name" required maxlength="100"><div class="form-row"><div><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" required></div><div><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" placeholder="Contact number" required></div></div><div class="form-row"><div><label for="date">Preferred date</label><input id="date" name="date" type="date" required></div><div><label for="time">Preferred time</label><select id="time" name="time" required><option value="">Choose a time</option><option>9:00 am</option><option>10:00 am</option><option>11:00 am</option><option>12:00 pm</option><option>2:00 pm</option><option>3:00 pm</option><option>4:00 pm</option><option>5:00 pm</option><option>6:00 pm</option><option>7:00 pm</option></select></div></div><label for="service">What would you like help with?</label><select id="service" name="service" required><option value="">Select a service</option><option>General check-up</option><option>Doctor consultation</option><option>Everyday wellness</option><option>Other</option></select><label for="notes">Anything you’d like us to know? <span style="font-weight:400;color:#899b93">(optional)</span></label><textarea id="notes" name="notes" maxlength="500" placeholder="A short note for our team"></textarea><button class="button" type="submit">Request appointment <span>↗</span></button><div class="form-message" role="status"></div></form><div class="form-switch">We’ll get back to you to confirm your visit.</div></section></main><footer class="footer"><div class="wrap footer-inner"><a class="brand brand-footer" href="index.html"><span class="brand-mark">✚</span><span>vimal<span class="brand-light">clinic</span><small>CARE, CLOSE TO HOME</small></span></a><span>© 2026 Vimal Clinic · Made with care</span><a href="about.html">Our story ↗</a></div></footer><script src="app.js"></script></body></html>
